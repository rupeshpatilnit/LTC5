<div class="body-diagram-shell">
  <div class="view-toggle" role="tablist" aria-label="Body view">
    <button
      type="button"
      class="view-button"
      [class.active]="activeView === 'front'"
      (click)="setView('front')"
      [attr.aria-pressed]="activeView === 'front'"
    >
      Front View
    </button>
    <button
      type="button"
      class="view-button"
      [class.active]="activeView === 'back'"
      (click)="setView('back')"
      [attr.aria-pressed]="activeView === 'back'"
    >
      Back View
    </button>
  </div>

  <div class="diagram-canvas" [attr.aria-label]="activeView + ' body diagram'">
    <!-- ═══════════════════════════════════════════════════════
         FRONT VIEW: Loaded from assets/data/male-front-body.svg
         ═══════════════════════════════════════════════════════ -->
    <div
      *ngIf="activeView === 'front'"
      #frontSvgContainer
      class="front-svg-container"
      (click)="onSvgClick($event)"
      (keydown)="onSvgKeydown($event)"
      (bodyRegionSelected)="onSvgBodyRegionSelected($event)"
      [innerHTML]="sanitizedFrontSvg"
    ></div>

    <div *ngIf="activeView === 'front' && !frontSvgLoaded && !frontSvgError" class="diagram-loading">
      <span class="loading-spinner"></span>
      <span>Loading front body diagram...</span>
    </div>

    <div *ngIf="activeView === 'front' && frontSvgError" class="diagram-error">
      <span>Failed to load male-front-body.svg from assets/data.</span>
    </div>

    <!-- ═══════════════════════════════════════════════════════
         BACK VIEW: Anatomical dorsal silhouette & interactive regions
         ═══════════════════════════════════════════════════════ -->
    <svg
      *ngIf="activeView === 'back'"
      viewBox="0 0 200 530"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="body-diagram-title-back"
    >
      <title id="body-diagram-title-back">Back body diagram</title>

      <g class="body-silhouette" aria-hidden="true">

          <line x1="100" y1="68" x2="100" y2="261"
                stroke="#3a4a52" stroke-width="0.6" stroke-dasharray="3,3" opacity="0.28"/>
          <path d="M 82,90 Q 77,112 80,134 Q 84,141 91,136"
                fill="none" stroke="#3a4a52" stroke-width="0.8" opacity="0.32"/>
          <path d="M 118,90 Q 123,112 120,134 Q 116,141 109,136"

                fill="none" stroke="#3a4a52" stroke-width="0.9" opacity="0.32"/>

        </g>

        <!-- ── VIEW LABEL ── -->
        <text
          x="100" y="10"
          text-anchor="middle"
          font-size="6"
          font-family="'Helvetica Neue', Arial, sans-serif"
          fill="#3a4a52"
          letter-spacing="1.2"
          opacity="0.55"
        >DORSAL VIEW</text>
      </g>

      <!-- ── BACK INTERACTIVE REGIONS ── -->
      <g *ngFor="let region of visibleRegions('back')">
        <path
          [attr.d]="region.svgPath"
          class="body-region"
          [class.selected]="isSelected(region.id)"
          [attr.aria-label]="region.displayName"
          [attr.aria-selected]="isSelected(region.id)"
          [attr.tabindex]="disabled ? -1 : 0"
          role="button"
          (click)="selectRegion(region.id)"
          (keydown)="handleKeydown($event, region.id)"
        ></path>
      </g>
    </svg>
  </div>
</div>
