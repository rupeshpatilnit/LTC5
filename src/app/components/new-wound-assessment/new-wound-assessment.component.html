<main class="assessment-page">
  <header class="assessment-header">
    <button type="button" class="back-dashboard-btn" (click)="goToDashboard()">
      ← Back to Dashboard
    </button>
    <div class="resident-picker">
      <label for="resident-select">Resident</label>
      <select id="resident-select" [formControl]="form.controls.residentId">
        <option value="R-1001">Hunt, Ethan (101-A)</option>
        <option value="R-1002">Johnson, Clara (118-B)</option>
        <option value="R-1005">Holmes, Sherlock (105-B)</option>
      </select>
    </div>
  </header>

  <section class="assessment-card">
    <div class="assessment-header-row">
      <div class="assessment-code">W-2024-009 | 9/8/2026</div>
      <div class="assessment-title">Wound Documentation</div>
    </div>

    <div class="assessment-layout">
      <section class="diagram-panel">
        <app-body-diagram [diagramVariant]="[form.get('diagramVariant')?.value ?? 'male']"
          [selectedRegionId]="form.get('woundLocationId')?.value ?? null"
          [activeView]="form.get('bodyView')?.value ?? 'front'" (regionSelected)="onRegionSelected($event)"
          (viewChanged)="onViewChanged($event)" (selectionCleared)="clearSelection()"></app-body-diagram>
      </section>

      <section class="location-panel">
        <app-wound-location-selector [selectedRegionId]="form.get('woundLocationId')?.value ?? null"
          [bodyView]="form.get('bodyView')?.value ?? 'front'"
          [diagramVariant]="[form.get('diagramVariant')?.value ?? 'male']"
          [customLocation]="form.get('woundLocation')?.value ?? ''" (locationSelected)="onLocationSelected($event)"
          (customLocationChange)="onCustomLocationChanged($event)"
          (clearSelection)="clearSelection()"></app-wound-location-selector>

        <div class="location-error" *ngIf="formSubmitted && locationErrorMessage">
          {{ locationErrorMessage }}
        </div>
      </section>
    </div>

    <form [formGroup]="form" (ngSubmit)="submitAssessment()" class="assessment-form">
      <div class="field-row two-col">
        <div class="field-group">
          <label>Wound Type <span class="required">*</span></label>
          <select formControlName="woundType">
            <option value="">Select Type</option>
            <option value="Pressure Ulcer">Pressure Ulcer</option>
            <option value="Surgical">Surgical</option>
            <option value="Diabetic">Diabetic</option>
            <option value="Vascular">Vascular</option>
          </select>
        </div>

        <div class="field-group">
          <label>Stage <span class="required">*</span></label>
          <select formControlName="stage">
            <option value="">Select Type First</option>
            <option value="Stage 1">Stage 1</option>
            <option value="Stage 2">Stage 2</option>
            <option value="Stage 3">Stage 3</option>
            <option value="Stage 4">Stage 4</option>
            <option value="Unstageable">Unstageable</option>
          </select>
        </div>

        <div class="field-group">
          <label>Onset Date <span class="required">*</span></label>
          <input type="date" formControlName="onsetDate" />
        </div>
      </div>

      <div class="field-row two-col">
        <div class="field-group">
          <label>Identified By</label>
          <select formControlName="identifiedBy">
            <option value="">Select</option>
            <option value="Nurse">Nurse</option>
            <option value="Physician">Physician</option>
            <option value="Dietitian">Dietitian</option>
          </select>
        </div>

        <div class="field-group checkbox-row">
          <label class="checkbox-wrap">
            <input type="checkbox" formControlName="presentOnAdmission" />
            <span>Present on Admission (POA)</span>
          </label>
        </div>
      </div>

      <div class="measurement-section">
        <h3>Wound Measurements</h3>
        <div class="field-row three-col">
          <div class="field-group">
            <label>Length (cm) <span class="required">*</span></label>
            <input type="number" formControlName="length" min="0" step="0.1" />
          </div>
          <div class="field-group">
            <label>Width (cm) <span class="required">*</span></label>
            <input type="number" formControlName="width" min="0" step="0.1" />
          </div>
          <div class="field-group">
            <label>Depth (cm)</label>
            <input type="number" formControlName="depth" min="0" step="0.1" />
          </div>
        </div>

        <div class="field-row three-col">
          <div class="field-group">
            <label>Drainage <span class="required">*</span></label>
            <select formControlName="drainage">
              <option value="">Select</option>
              <option value="None">None</option>
              <option value="Scant">Scant</option>
              <option value="Moderate">Moderate</option>
              <option value="Heavy">Heavy</option>
            </select>
          </div>
          <div class="field-group">
            <label>Necrotic (%)</label>
            <input type="number" formControlName="necroticPercentage" min="0" max="100" />
          </div>
          <div class="field-group">
            <label>Granulation (%)</label>
            <input type="number" formControlName="granulationPercentage" min="0" max="100" />
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="secondary-button" (click)="clearSelection()">Clear</button>
        <button type="submit" class="primary-button">Save Assessment</button>
      </div>
    </form>

    <div class="submit-preview" *ngIf="submissionResult()">
      <h4>Submission payload</h4>
      <pre>{{ submissionResult() | json }}</pre>
    </div>
  </section>
</main>
